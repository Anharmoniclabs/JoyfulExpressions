name: Validate and deploy Joyful Expressions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Fully decode images, check hashes, dimensions and links
        run: python scripts/validate_site.py
      - run: node --check assets/script.js
      - name: Package only the public website
        run: |
          mkdir -p _site/assets
          cp index.html robots.txt sitemap.xml _site/
          cp assets/styles.css assets/refined.css assets/halloween.css assets/salon-palette.css assets/script.js assets/favicon.svg _site/assets/
          cp -r assets/images _site/assets/
          rm -f _site/assets/images/manifest.json
          touch _site/.nojekyll
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Validate the packaged website
        run: python scripts/validate_site.py --site-root _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
