name: Import original client photographs
on:
  push:
    branches: [fix/original-photo-assets]
    paths:
      - 'scripts/import_photos.py'
      - 'scripts/photo-import.json'
      - '.github/workflows/import-original-photos.yml'
permissions:
  contents: write
concurrency:
  group: original-photo-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/original-photo-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install Pillow==12.3.0
      - name: Import and decode-check original photographs
        run: python scripts/import_photos.py
      - name: Commit actual binary files, not encoded text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images
          if ! git diff --cached --quiet; then
            git commit -m 'Import full-resolution client photos and original logo as binary assets'
            git push origin HEAD:fix/original-photo-assets
          fi
