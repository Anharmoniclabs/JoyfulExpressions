name: Apply original-photo layout
on:
  push:
    branches: [fix/original-photo-assets]
    paths:
      - 'scripts/refine_site.py'
      - 'scripts/validate_site.py'
      - 'assets/refined.css'
      - 'assets/script.js'
      - '.github/workflows/refine-original-layout.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/original-photo-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Apply responsive layout and logo variants
        run: python scripts/refine_site.py
      - name: Check actual decoded images and all referenced paths
        run: python scripts/validate_site.py
      - run: node --check assets/script.js
      - name: Commit the finished HTML and image files together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch assets/encoded
          git add index.html assets/images
          if ! git diff --cached --quiet; then
            git commit -m 'Apply original-photo layout, uncropped gallery and responsive brand logo'
            git push origin HEAD:fix/original-photo-assets
          fi
